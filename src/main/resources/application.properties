spring.application.name=store
server.port=8080

# Supabase PostgreSQL Configuration
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' automatically creates/updates tables to match your Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Security Config
jwt.secret=storeAppSuperSecretKeyForJWTTokenSigningAndVerification2026_MustBeAtLeast32BytesLong!
jwt.expiration=86400000

# ----------------------------------------
# SUPABASE / POSTGRES CONNECTION POOLING
# ----------------------------------------
# Increase the maximum number of simultaneous connections (Default is 10)
spring.datasource.hikari.maximum-pool-size=20

# Keep fewer idle connections hanging around to save Supabase resources
spring.datasource.hikari.minimum-idle=2

# How long a connection can sit idle before Spring kills it (30 seconds)
spring.datasource.hikari.idle-timeout=30000

# Maximum time a connection can live before being aggressively recycled (10 minutes)
spring.datasource.hikari.max-lifetime=600000

# How long to wait for an available connection before throwing an error (5 seconds)
spring.datasource.hikari.connection-timeout=20000